name: Testes Automatizados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Rodar os testes com Cypress
        uses: cypress-io/github-action@v6
        with:
          start: npm run start
          wait-on: "http://localhost:8080"
          browser: chrome

      - name: Publicar screenshots de falhas (se houver)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-de-falha
          path: cypress/screenshots
          retention-days: 15

      - name: Preparar site para o GitHub Pages
        run: |
          mkdir -p pages
          cp index.html pages/index.html
          cp game/assets/styles.css pages/
          cp game/assets/script.js pages/
          cp game/assets/logo.png pages/

      - name: Enviar site para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

  publicar:
    needs: testes
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4